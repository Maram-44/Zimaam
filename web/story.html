<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سياج SIAAJ</title>
<meta name="description" content="سياج: كشف محاولات الوصول إلى مستندات محجوبة في مساعدات الذكاء الاصطناعي المؤسسية، واختبار احترام الصلاحيات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14212B; --paper:#EDF0EE; --panel:#FFFFFF; --line:#C9D1CE; --muted:#566770;
  --fence:#1F6F68; --fence-soft:#D3E6E3; --alert:#C8372D; --amber:#B97A12; --amber-soft:#F6E7C8;
  --d-bg:#14212B; --d-panel:#1B2C38; --d-line:#2E4655; --d-text:#E7EFED; --d-muted:#94A9B2; --d-alert:#FF7468; --d-ok:#6FD0C4;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--f-body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fence);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.logo{display:flex;align-items:baseline;gap:12px}
.logo b{font:700 34px/1 var(--f-display);letter-spacing:0}
.logo span{font:500 14px var(--f-body);color:var(--muted);direction:ltr}
.lang{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 16px;font-weight:500}
.lang:hover{border-color:var(--fence)}

/* intro */
.intro{padding:22px 0 18px}
.intro h1{font:700 clamp(28px,4.4vw,46px)/1.25 var(--f-display);margin:0 0 10px;max-width:26ch;text-wrap:balance}
.intro p{margin:0;max-width:62ch;color:var(--muted);font-size:17px}

/* story bar */
.story{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:center;margin-bottom:14px}
.story .where{font-weight:600;color:var(--fence)}
.story .cap{margin:2px 0 0;max-width:78ch;min-height:3.3em}
.story .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--panel);border-radius:4px;padding:8px 16px;font-weight:500}
.btn:hover:not(:disabled){background:var(--ink);color:#fff}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--fence);border-color:var(--fence)}
.btn:disabled{opacity:.45;cursor:default}
.btn.quiet{border-color:var(--line)}
.btn.small{padding:4px 12px;font-size:14px}

/* stage: employee | fence | security */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);min-height:600px;border-radius:4px;overflow:hidden;border:1px solid var(--ink)}
.side{display:flex;flex-direction:column;min-width:0}
.side h2{font:700 20px/1.2 var(--f-display);margin:0}
.side header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.emp{background:var(--panel)}
.sec{background:var(--d-bg);color:var(--d-text)}
.sec header{border-color:var(--d-line)}
.sec .clock{font-size:13px;color:var(--d-muted)}
.fence{position:relative;background:var(--paper) repeating-linear-gradient(90deg,var(--fence) 0 3px,transparent 3px 9px);border-inline:1px solid var(--ink);transition:background-color .4s}
.fence::before,.fence::after{content:"";position:absolute;inset-inline:0;height:3px;background:var(--ink)}
.fence::before{top:22%}.fence::after{bottom:22%}
.fence.alarm{background:var(--paper) repeating-linear-gradient(90deg,var(--alert) 0 3px,transparent 3px 9px)}

/* employee */
.users{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 0}
.users .lbl{width:100%;font-size:13px;color:var(--muted)}
.user{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 14px;font-size:15px}
.user small{color:var(--muted);margin-inline-start:6px}
.user[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.user[aria-pressed="true"] small{color:#B9C8CE}
.chat{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px;min-height:200px;max-height:330px}
.empty{color:var(--muted);margin:auto 0;text-align:center}
.q{align-self:flex-end;background:var(--fence-soft);border-radius:14px 14px 2px 14px;padding:6px 14px;max-width:85%;direction:ltr;text-align:left}
[dir=rtl] .q{border-radius:14px 14px 14px 2px;align-self:flex-start}
.a{max-width:92%;border-inline-start:3px solid var(--fence);padding:2px 12px}
.a .src{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
.a .txt{direction:ltr;text-align:left;display:block}
.a.none{border-color:var(--line);color:var(--muted)}
.a.leak{border-color:var(--alert)}
.a.leak .src{color:var(--alert);font-weight:600}
.chips{padding:0 18px 8px;display:flex;flex-direction:column;gap:8px}
.chips .grp{font-size:13px;color:var(--muted);margin-bottom:2px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:14px;direction:ltr}
.chip:hover:not(:disabled){border-color:var(--fence);background:var(--fence-soft)}
.chip.probe{border-style:dashed;border-color:var(--amber)}
.chip.probe:hover:not(:disabled){background:var(--amber-soft)}
.chip:disabled{opacity:.5}
.ask{display:flex;gap:8px;padding:10px 18px 16px;border-top:1px solid var(--line)}
.ask input{flex:1;min-width:0;border:1px solid var(--ink);border-radius:4px;padding:8px 12px;background:#fff;direction:ltr;text-align:left}

/* security */
.sec .body{padding:14px 18px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.sec h3{font:600 16px var(--f-body);margin:0 0 4px}
.sec .help{margin:0 0 8px;font-size:13px;color:var(--d-muted)}
.sec .none{color:var(--d-muted);margin:4px 0;font-size:15px}
.ctr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:8px 10px;border:1px solid var(--d-line);border-radius:4px;margin-bottom:6px;background:var(--d-panel)}
.ctr .who{font-weight:500}
.ctr .res{color:var(--d-muted);font-size:14px;grid-column:1}
.pick{display:flex;gap:4px;grid-row:1/3;grid-column:2;align-items:center}
.pick i{display:block;width:10px;height:26px;border:1.5px solid var(--d-muted);border-radius:1px}
.pick i.on{background:var(--d-ok);border-color:var(--d-ok)}
.ctr.alert{border-color:var(--d-alert)}
.ctr.alert .pick i.on{background:var(--d-alert);border-color:var(--d-alert)}
.ctr .n{font-size:13px;color:var(--d-muted);margin-inline-start:6px;min-width:34px;direction:ltr;text-align:end}
.ctr.alert .n{color:var(--d-alert);font-weight:600}
.ctr.flash{animation:flash 1.1s ease-out 1}
@keyframes flash{0%{background:#5b2420}100%{background:var(--d-panel)}}
.alertbox{border:1px solid var(--d-alert);border-radius:4px;padding:10px 12px;margin-bottom:8px;display:grid;gap:6px;background:#2A1D22}
.alertbox .sev{font-weight:600;color:var(--d-alert)}
.sec .btn{border-color:var(--d-text);background:transparent;color:var(--d-text)}
.sec .btn:hover:not(:disabled){background:var(--d-text);color:var(--d-bg)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.feed li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--d-line)}
.feed time{color:var(--d-muted);font-size:12px;direction:ltr}
.tag{font-size:12px;border:1px solid var(--d-muted);border-radius:3px;padding:0 6px;color:var(--d-muted);white-space:nowrap}
.tag.denied{border-color:var(--amber);color:#F0B34C}
.tag.leak{border-color:var(--d-alert);color:var(--d-alert);font-weight:600}

/* permissions test */
.perm{margin:22px 0 0;background:var(--panel);border:1px solid var(--ink);border-radius:4px;padding:18px}
.perm h2{font:700 24px var(--f-display);margin:0 0 4px}
.perm>p{margin:0 0 14px;color:var(--muted);max-width:70ch}
.perm-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
.perm-grid>*{min-width:0}
.tblwrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center}
th{background:var(--paper);font-weight:600}
td.name{text-align:start;font-weight:500;white-space:nowrap}
td.ok{color:var(--fence);font-weight:600}
td.stale{background:var(--amber-soft);color:var(--amber);font-weight:700}
td.no{color:#9AA7AD}
.legend{font-size:13px;color:var(--muted);margin:6px 0 0}
.ctrls{display:grid;gap:12px;align-content:start}
.seg{display:grid;gap:6px}
.seg label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:8px 10px;cursor:pointer}
.seg input{margin-top:5px}
.seg label:has(input:checked){border-color:var(--fence);background:var(--fence-soft)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.result{border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-height:60px}
.result .big{font:700 28px/1.1 var(--f-display)}
.result.bad{border-color:var(--alert)}.result.bad .big{color:var(--alert)}
.result.good{border-color:var(--fence)}.result.good .big{color:var(--fence)}
.kv{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
.kv small{display:block;color:var(--muted)}

/* about */
details.about{margin:22px 0 60px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
details.about summary{padding:14px 18px;font:700 20px var(--f-display);cursor:pointer}
details.about ul{margin:0;padding:0 18px 16px;padding-inline-start:38px;max-width:80ch;display:grid;gap:8px}

/* case dialog */
dialog{border:1px solid var(--ink);border-radius:4px;padding:0;width:min(720px,94vw);max-height:90vh;color:var(--ink);background:var(--panel)}
dialog::backdrop{background:rgba(20,33,43,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{font:700 22px var(--f-display);margin:0}
.dlg-b{padding:14px 18px 20px;overflow:auto;max-height:calc(90vh - 70px);display:grid;gap:14px}
.dlg-b h3{font:600 16px var(--f-body);margin:0 0 4px}
.dlg-b ul{margin:0;padding-inline-start:22px}
.dlg-b .meta{display:flex;gap:22px;flex-wrap:wrap}
.dlg-b .meta small{display:block;color:var(--muted)}
.toast{position:fixed;inset-inline:0;bottom:18px;margin:0 auto;width:max-content;max-width:92vw;background:var(--alert);color:#fff;padding:8px 18px;border-radius:4px;z-index:9}

@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 30px auto}
  .fence{border-inline:0;border-block:1px solid var(--ink)}
  .story{grid-template-columns:minmax(0,1fr)}
  .perm-grid{grid-template-columns:minmax(0,1fr)}
  .chat{max-height:280px}
}
@media (prefers-reduced-motion:reduce){.ctr.flash{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="logo"><b data-i18n="appName">سياج</b><span>SIAAJ</span></div>
    <button class="lang" id="langBtn" type="button">English</button>
  </div>

  <section class="intro">
    <h1 data-i18n="headline"></h1>
    <p data-i18n="lead"></p>
  </section>

  <section class="story" aria-label="story">
    <div>
      <div class="where" id="where"></div>
      <p class="cap" id="caption" aria-live="polite"></p>
    </div>
    <div class="btns">
      <button class="btn primary" id="nextBtn" type="button"></button>
      <button class="btn" id="playBtn" type="button"></button>
      <button class="btn quiet" id="restartBtn" type="button"></button>
    </div>
  </section>

  <section class="stage">
    <div class="side emp">
      <header><h2 data-i18n="empTitle"></h2></header>
      <div class="users" id="users" role="group"></div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="ask" id="askForm">
        <input id="askInput" maxlength="300" autocomplete="off" aria-label="question">
        <button class="btn primary" type="submit" data-i18n="send"></button>
      </form>
    </div>
    <div class="fence" id="fence" aria-hidden="true"></div>
    <div class="side sec">
      <header><h2 data-i18n="secTitle"></h2><span class="clock" id="clock"></span></header>
      <div class="body">
        <div>
          <h3 data-i18n="counters"></h3>
          <p class="help" data-i18n="countersHelp"></p>
          <div id="counters"></div>
        </div>
        <div>
          <h3 data-i18n="alerts"></h3>
          <div id="alerts"></div>
        </div>
        <div>
          <h3 data-i18n="feed"></h3>
          <ul class="feed" id="feed"></ul>
        </div>
      </div>
    </div>
  </section>

  <section class="perm" id="perm">
    <h2 data-i18n="permTitle"></h2>
    <p data-i18n="permLead"></p>
    <div class="perm-grid">
      <div>
        <div class="tblwrap"><table id="matrix"></table></div>
        <p class="legend" id="legend"></p>
      </div>
      <div class="ctrls">
        <div class="seg" id="modeSeg" role="radiogroup"></div>
        <div class="btnrow">
          <button class="btn" id="revokeBtn" type="button"></button>
          <button class="btn" id="auditBtn" type="button"></button>
          <button class="btn" id="syncBtn" type="button"></button>
        </div>
        <div class="result" id="auditOut"></div>
      </div>
    </div>
  </section>

  <details class="about">
    <summary data-i18n="aboutTitle"></summary>
    <ul id="aboutList"></ul>
  </details>
</div>

<dialog id="caseDlg" aria-labelledby="caseTitle">
  <div class="dlg-h"><h2 id="caseTitle"></h2><button class="btn small" id="caseClose" type="button"></button></div>
  <div class="dlg-b" id="caseBody"></div>
</dialog>
<div class="toast" id="toast" role="alert" hidden></div>

<script>

/* ---------- strings ---------- */

 act:"المشهد {n} من {t}", doneCap:"انتهت المشاهد. جرّب بنفسك في الأسفل، أو ابدأ من جديد.",

  {t:"موظفة تقترب من ملف محجوب", c:"نورة من الموارد البشرية تعيد صياغة أسئلتها عن التقرير المالي. لا تظهر لها أي رسالة رفض، لكن عدّاد الأمن يرتفع، وعند الحد ينطلق الإنذار."},

 lag:"بقيت الثغرة مفتوحة {m} دقيقة (ساعة المحاكاة)", clean:"لا تسريب.",
 leakItem:"{u} سأل عن «{a}» فقُدّم له «{s}»",
 aboutTitle:"ما الحقيقي وما المحاكى",
 about:[
  "كل البيانات اصطناعية: شركة وهمية وخمسة موظفين وخمسة مستندات.",
  "فهم الأسئلة هنا لفظي بسيط (TF-IDF). النموذج الدلالي الحقيقي يُستبدل بسطر واحد لكنه يحتاج معايرة.",

function h(tag, attrs, ...kids){

    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}

async function api(path, opts = {}){
  const r = await fetch("/api" + path, { method: opts.method || "GET", headers: { "Content-Type": "application/json", "X-Session-Id": S.sid }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!r.ok){ let d = ""; try { d = (await r.json()).detail; } catch (e) {} throw new Error(typeof d === "string" && d ? d : t("err") + " (" + r.status + ")"); }
  return r.json();

/* ---------- actions ---------- */
function setUser(u){ S.user = u; renderEmployee(); }
async function ask(user, query, adv = 25){
  const out = await api("/ask", { method: "POST", body: { user_id: user, query, advance_minutes: adv } });
  S.state = out.state;
  (S.chat[user] = S.chat[user] || []).push({ q: query, a: out.employee, leak: out.security.leak });
  S.feed.unshift({ user, ...out.security });
  S.feed.length = Math.min(S.feed.length, 40);
  renderAll();
  return out;
}

  $("#counters").replaceChildren(...(cs.length ? cs.map(c => {
    const alert = c.events >= c.threshold, key = c.user_id + c.resource;
    const fresh = alert && !S.alerted.has(key); if (alert) S.alerted.add(key);

    h("div", { class: "alertbox" },

/* ---------- story ---------- */
async function guarded(fn){ S.running = true; renderAll(); try { await fn(); } catch (e){ toast(e.message); } S.running = false; S.caption = S.caption; renderAll(); }
const ACTS = [
  async () => { for (const [u, q] of [["mohamed", "quarterly revenue forecast"], ["sara", "sales pipeline deals"], ["noura", "leave policy and working hours"]]){ setUser(u); await ask(u, q, 40); await sleep(900); } },
  async () => { setUser("noura"); for (const q of PROBE_Q["FIN-REP"]){ await ask("noura", q, 360); await sleep(1100); } },
  async () => { await openCase("noura"); },
  async () => {
    S.state = await api("/mode", { method: "POST", body: { acl_mode: "snapshot" } });
    S.state = await api("/revoke", { method: "POST", body: { user_id: "ahmed", doc_id: "FIN-REP" } }); renderAll(); await sleep(1500);
    setUser("ahmed"); S.caption = L().act4[0]; renderStory();
    await ask("ahmed", "quarterly revenue forecast budget and profit", 5); await sleep(1800);
    S.caption = L().act4[1]; renderStory(); if (!reduced) $("#perm").scrollIntoView({ behavior: "smooth", block: "center" });
    S.audit = await api("/audit"); renderPerm(); await sleep(2200);
    S.caption = L().act4[2]; renderStory();
    const sy = await api("/sync", { method: "POST", body: { advance_minutes: 15 } }); S.state = sy.state; S.lag = sy.revocation_lags.length ? sy.revocation_lags[0].lag_seconds : null;
    S.audit = await api("/audit"); renderAll();
  }];
async function runAct(){ if (S.act >= ACTS.length) return; S.caption = null; const i = S.act; await guarded(async () => { await ACTS[i](); S.act = i + 1; S.caption = null; }); }
async function playAll(){ while (S.act < ACTS.length && !S.stop){ await runAct(); await sleep(1800); } }
async function restart(){
  S.caption = null;
  await guarded(async () => { S.state = await api("/reset", { method: "POST" }); S.chat = {}; S.feed = []; S.act = 0; S.audit = null; S.lag = null; S.alerted = new Set(); S.user = "noura"; });
}

async function submit(q){
  q = (q || "").trim(); if (!q || S.running) return;
  const inp = $("#askInput");
  try { await ask(S.user, q, 25); inp.value = ""; } catch (e){ toast(e.message); }
}

$("#nextBtn").addEventListener("click", runAct);
$("#playBtn").addEventListener("click", playAll);
$("#restartBtn").addEventListener("click", restart);
$("#langBtn").addEventListener("click", () => { S.lang = S.lang === "ar" ? "en" : "ar"; try { localStorage.setItem("siaaj_lang", S.lang); } catch (e) {} applyLang(); renderAll(); });
$("#caseClose").addEventListener("click", () => $("#caseDlg").close());
$("#auditBtn").addEventListener("click", async () => { try { S.audit = await api("/audit"); renderPerm(); } catch (e){ toast(e.message); } });
$("#revokeBtn").addEventListener("click", async () => { try { S.state = await api("/revoke", { method: "POST", body: { user_id: "ahmed", doc_id: "FIN-REP" } }); renderAll(); } catch (e){ toast(e.message); } });
$("#syncBtn").addEventListener("click", async () => { try { const sy = await api("/sync", { method: "POST", body: { advance_minutes: 15 } }); S.state = sy.state; S.lag = sy.revocation_lags.length ? sy.revocation_lags[0].lag_seconds : S.lag; S.audit = await api("/audit"); renderAll(); } catch (e){ toast(e.message); } });

applyLang();
refreshState().then(applyLang).catch(e => toast(e.message));
</script>
</body>
</html>
